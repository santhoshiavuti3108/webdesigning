<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Temperature Converter</h1>

        <p>Convert temperature between Celsius, Fahrenheit and Kelvin.</p>

        <div class="converter">

            <!-- Temperature Input -->
            <label for="temperature">Enter Temperature</label>
            <input 
                type="number" 
                id="temperature" 
                placeholder="Enter temperature"
            >

            <!-- Unit Selection -->
            <label for="unit">Select Unit</label>
            <select id="unit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <!-- Convert Button -->
            <button onclick="convertTemperature()">Convert</button>

            <!-- Result -->
            <div id="result">
                <p>Enter a temperature and click Convert.</p>
            </div>

        </div>

    </div>

    <script>
    function convertTemperature() {
        let tempInput = document.getElementById("temperature");
        let unitInput = document.getElementById("unit");
        let result = document.getElementById("result");

        if (!tempInput || !unitInput || !result) {
            return;
        }

        let temperature = Number(tempInput.value);
        let unit = unitInput.value;

        if (tempInput.value.trim() === "" || isNaN(temperature)) {
            result.innerHTML = "<p>Please enter a valid temperature.</p>";
            return;
        }

        if (unit === "celsius" && temperature < -273.15) {
            result.innerHTML = "<p>Temperature cannot be below absolute zero (-273.15°C).</p>";
            return;
        }
        if (unit === "fahrenheit" && temperature < -459.67) {
            result.innerHTML = "<p>Temperature cannot be below absolute zero (-459.67°F).</p>";
            return;
        }
        if (unit === "kelvin" && temperature < 0) {
            result.innerHTML = "<p>Kelvin temperature cannot be below 0 K.</p>";
            return;
        }

        let celsius, fahrenheit, kelvin;

        if (unit === "celsius") {
            celsius = temperature;
            fahrenheit = (temperature * 9 / 5) + 32;
            kelvin = temperature + 273.15;
        } else if (unit === "fahrenheit") {
            fahrenheit = temperature;
            celsius = (temperature - 32) * 5 / 9;
            kelvin = celsius + 273.15;
        } else if (unit === "kelvin") {
            kelvin = temperature;
            celsius = temperature - 273.15;
            fahrenheit = (celsius * 9 / 5) + 32;
        }

        result.innerHTML = `
            <p><strong>Celsius:</strong> ${celsius.toFixed(2)} °C</p>
            <p><strong>Fahrenheit:</strong> ${fahrenheit.toFixed(2)} °F</p>
            <p><strong>Kelvin:</strong> ${kelvin.toFixed(2)} K</p>
        `;
    }
</script>

</body>
</html>
